# Fallback config only. Docker builds copy the generated generated/nginx.conf,
# which contains the exact API origin and static-export script hashes.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; script-src-attr 'none'; connect-src 'self' https://nominatim.openstreetmap.org; img-src 'self' data: blob: https://images.unsplash.com https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

    # Never let the SPA fallback turn a dotfile or deployment-artifact probe into
    # a 200 HTML response. `_headers` is generated for Netlify (which consumes and
    # strips it), so on this path it must be unreachable.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location ~ (^|/)\. { return 404; }
    location ~* (^|/)(?:_headers|_redirects|nginx\.conf|dockerfile|docker-compose\.ya?ml|package(?:-lock)?\.json|tsconfig\.json|next\.config\.(?:js|mjs|ts)|\.git)(?:/|$) { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; script-src-attr 'none'; connect-src 'self' https://nominatim.openstreetmap.org; img-src 'self' data: blob: https://images.unsplash.com https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
        try_files $uri =404;
    }
}
